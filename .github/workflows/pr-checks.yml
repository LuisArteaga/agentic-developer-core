name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  AGENT_MODE: ci
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OpenRouter API key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "[ERR] OPENROUTER_API_KEY secret not configured."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp openinference-semantic-conventions

      - name: Run LLM review
        if: always()
        run: git diff origin/main...HEAD | scripts/review.sh
