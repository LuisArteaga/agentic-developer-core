name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  AGENT_MODE: ci
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OpenRouter API key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "[ERR] OPENROUTER_API_KEY secret not configured."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp openinference-semantic-conventions

      - name: Cache tree-sitter parsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-py3.12-

      - name: Prefetch tree-sitter parsers
        # tree-sitter-language-pack downloads parser binaries at runtime from
        # GitHub releases. In CI, a fresh checkout has no cache, and the
        # releases endpoint can return 503 (rate-limiting/transient outage),
        # causing cascading test failures in outline-dependent tests
        # (ADR-0017). Prefetch the required languages (Python, TypeScript)
        # with retries so tests have parsers available locally.
        run: |
          python3 -c "
          import tree_sitter_language_pack as tsp
          import time, sys
          langs = ['python', 'tsx', 'typescript']
          for attempt in range(3):
              try:
                  tsp.prefetch(languages=langs)
                  print(f'Prefetched: {tsp.downloaded_languages()}')
                  sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt+1} failed: {e}')
                  time.sleep(5)
          print('ERROR: Failed to prefetch tree-sitter parsers after 3 attempts')
          sys.exit(1)
          "

      - name: Run secret scan
        run: python3 scripts/secret_scan.py

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check orchestrator scripts
          ruff format --check orchestrator scripts

      - name: Run Mypy Typecheck
        run: mypy orchestrator scripts

      - name: Run Pytest Coverage Check
        # --cov=scripts keeps the judge code itself (scripts/review.py,
        # production code run in CI) under the global coverage floor. The JSON
        # report feeds the Diff Coverage Gate below; term-missing keeps the
        # per-file missing-line table visible in the CI logs for humans.
        # Changed-line coverage is enforced deterministically by the gate
        # (ADR-0052); the Test Coverage judge evaluates semantics from the
        # diff alone (issue #149).
        run: |
          set -o pipefail
          pytest --cov=orchestrator --cov=scripts --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=89

      - name: Run Diff Coverage Gate
        # Deterministic hard check (ADR-0052): fails the job when any
        # production line added by this branch's diff is not exercised by
        # the tests — before any LLM judge tokens are spent. The base SHA
        # comes from the event payload so non-default bases and forked heads
        # resolve correctly; the script resolves the merge-base itself
        # (requires fetch-depth: 0 on checkout). No `if: always()` — if
        # pytest failed, the job is already red, and this gate consumes the
        # coverage.json that run produces.
        run: python3 scripts/diff_coverage_gate.py --coverage-json coverage.json --base ${{ github.event.pull_request.base.sha }}

      - name: Run Semgrep Security Scan
        run: semgrep scan orchestrator scripts --config=auto --error

      - name: Run Pip-Audit Dependency Check
        run: pip-audit .

      - name: Run LLM review
        # Default success gating — deliberately NO `if: always()`. The judges
        # only spend tokens when every deterministic gate above is green:
        # a failing lint/mypy/pytest/diff-coverage run already blocks the
        # merge, so reviewing that diff adds cost without authority. The old
        # `always()` was a visibility fallback from before the deterministic
        # syntax pre-check (ADR-0025) and the Diff Coverage Gate (ADR-0052)
        # made it redundant.
        run: git diff -w origin/main...HEAD -- . ':(exclude)uv.lock' | scripts/review.sh
