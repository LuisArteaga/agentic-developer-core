# Sources configuration for the Web Search (#38) and URL Fetch (#39) Worker
# Tools. Loaded once at orchestrator startup and cached
# (orchestrator/sources_config.py).
#
# strict = true  => search is restricted to the listed urls/domains. When strict
#   is true, at least one of urls/domains MUST be non-empty (validated at load,
#   raising ValueError otherwise). See config/sources.example.toml.
#
# Adopted from agentic-planner-core's strict allowlist profile (domains + search
# budgets). The [security]/[zero_tolerance] tables of the planner are NOT ported:
# this project's SourcesConfig schema does not model them, so they would have no
# effect here.

strict = true
urls = []
domains = [
    "arxiv.org",
    "dl.acm.org",
    "pypi.org",
    "npmjs.com",
    "python.langchain.com",
    "langgraph.org",
    "openrouter.ai",
    "github.com",
]

[search]
engine = "exa"
search_context_size = "medium"
max_results = 10
max_total_results = 15
excluded_domains = ["reddit.com", "stackoverflow.com"]
