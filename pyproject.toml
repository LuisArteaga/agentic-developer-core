[project]
name = "agentic-developer-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0,<2",
    "tree-sitter-language-pack>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "semgrep>=1.0.0",
    "pip-audit>=2.0.0",
    "pre-commit",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
disable_error_code = ["call-arg", "dict-item", "assignment"]

[tool.coverage.run]
omit = [
    "orchestrator/__main__.py",
]

[tool.pytest.ini_options]
filterwarnings = [
    # create_react_agent was migrated to langchain.agents.create_agent with the
    # `system_prompt` kwarg. Narrowly suppress only the
    # create_react_agent deprecation notice as a safety net; all other
    # LangGraph v1 deprecations are surfaced rather than blanket-ignored.
    "ignore:.*create_react_agent.*:langgraph.warnings.LangGraphDeprecatedSinceV10",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
