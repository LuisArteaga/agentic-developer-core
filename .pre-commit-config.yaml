repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Lockstep with the toolkit lint.yml RUFF_VERSION pin.
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/LuisArteaga/quality-gates-toolkit
    # Immutable release tag (toolkit D-0007) — never a floating ref.
    rev: v1.6.0
    hooks:
      - id: secret-scan
      - id: mypy
        args: ["orchestrator", "scripts"]
      - id: semgrep
        args: ['--config=p/security-audit', '--jobs=0', '--skip-unknown-extensions', '--quiet']
        types_or: [python, json, yaml]
      - id: pip-audit
        args: ["."]
